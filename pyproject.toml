# Virtual workspace root: no package of its own. One lockfile (uv.lock) pins every Python package here
# so they are always tested together. `uv sync --all-packages` installs them; `uv run --package X ...` runs one.
#
# document-intelligence is NOT a member: PaddlePaddle publishes no Python 3.14 wheel, so that service stays on
# 3.13 with its own lock (data/document-intelligence/uv.lock) and image.
[tool.uv.workspace]
members = [
    "server/engine",
    "server/server",
]
# loamz-reader runs on Python 3.13 (PaddlePaddle has no 3.14 wheels yet) with its own lock.
exclude = ["server/reader"]

# Indexes are read from the workspace root only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
loamz-engine = { workspace = true }
loamz-server = { workspace = true }
# The client libraries live in loamz-python; until they are on PyPI the server builds against its main branch.
loamz-core = { git = "https://github.com/loamz/loamz-python", subdirectory = "sdk/python/core" }
loamz-identity = { git = "https://github.com/loamz/loamz-python", subdirectory = "sdk/python/identity" }
loamz-data = { git = "https://github.com/loamz/loamz-python", subdirectory = "sdk/python/data" }

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "import-linter>=2.11",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
]

# One style for every loamz package (packages without their own [tool.ruff] inherit this).
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["loamz"]
