[project]
name = "loamz-agents-server"
version = "0.1.0"
description = "Loamz Agents: agent hosting (HTTP API, console, channels, automation) on the loamz-runtime."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "loamz-runtime[postgres,pdf,logging]",
    "loamz-core",
    "loamz-identity[server]",
    "httpx>=0.28,<1",
    "fastapi>=0.128",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.12,<3",
    "python-multipart>=0.0.20",
    "orjson>=3.10",
    "cryptography>=44",
    "opentelemetry-sdk>=1.20.0",
    # agent and group pictures (re-drawn as a square PNG)
    "pillow>=12.0.0",
    "pywebpush>=2.0,<3",
    # reading web pages for the agent's fetch tool
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# agent hosting: the model vendors, Redis, MCP, skills and the Loamz Data adapters (the agents image installs this)
models = ["loamz-runtime[openai,anthropic,gemini,redis,mcp,tools,data,sandbox,code]"]
# the interactive console (`loamz-agents-server chat`)
console = ["rich>=14.3.2", "prompt-toolkit>=3.0.0"]

[project.scripts]
loamz-agents-server = "loamz.server.agents.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "hypothesis>=6.168.3",
    "loamz-data[arrow]",
    "loamz-runtime[openai,tools,redis]",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "prompt-toolkit>=3.0.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

# `loamz` and `loamz.server` are namespaces shared with loamz-data-server (loamz.server.data): no __init__.py in either.
[tool.uv.build-backend]
module-name = "loamz.server.agents"
namespace = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["-m", "not slow and not integration"]
timeout = 120
markers = [
    "slow: needs Docker or minutes of runtime (a model, a real PostgreSQL with pgvector in a container)",
    "integration: needs Docker services (a throwaway SeaweedFS)",
    "requires_redis: skipped when Redis is not reachable (LOAMZ_TEST_REDIS_URL)",
]
