# Loamz cell: the self-host bundle (ADR 0006). One identical stack for every hosting model's smallest form.
#
#   ./gen-env.sh                                   # secrets
#   docker compose --profile agents up -d --build        # agent server as one process (default choice)
#   docker compose --profile microservices up -d --build   # agent server as ten services behind a gateway
#   add --profile ml for embedding-reranker and its llama.cpp sidecars (large model downloads)
#
# Exactly one of the monolith / microservices profiles. Ports are in ../PORTS.md; nothing but the UIs, the agent
# API, Keycloak and the S3 endpoint is published, and only on BIND_ADDR.
name: ${COMPOSE_PROJECT_NAME:-loamz-cell}

x-agent-image: &agent-image
  image: ${IMAGE_REGISTRY:-ghcr.io/ravikumarchavva}/loamz-agents:${IMAGE_TAG:-local}
  build: { context: ../.., dockerfile: deploy/docker/loamz-agents.Dockerfile }

x-agent-env: &agent-env
  # Loamz Agents native settings tree (LOAMZ_AGENTS_<SECTION>__<NAME>)
  LOAMZ_AGENTS_DATABASE__URL: postgresql://${POSTGRES_USER:-loamz}:${POSTGRES_PASSWORD:?run ./gen-env.sh}@postgres:5432/agentdb?sslmode=require
  LOAMZ_AGENTS_REDIS__URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  LOAMZ_AGENTS_OIDC__ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:${PORT_KEYCLOAK:-8081}}/realms/loamz
  LOAMZ_AGENTS_OIDC__AUDIENCE: loamz-agents
  LOAMZ_AGENTS_OIDC__INSECURE_HTTP: "true"
  LOAMZ_AGENTS_DIRECTORY__URL: http://keycloak:${PORT_KEYCLOAK:-8081}
  LOAMZ_AGENTS_DIRECTORY__REALM: loamz
  LOAMZ_AGENTS_DIRECTORY__CLIENT_ID: loamz-directory
  LOAMZ_AGENTS_DIRECTORY__CLIENT_SECRET: ${DIRECTORY_CLIENT_SECRET:-}
  LOAMZ_AGENTS_PUSH__VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  LOAMZ_AGENTS_PUSH__VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  LOAMZ_AGENTS_PUSH__CONTACT: ${VAPID_CONTACT:-mailto:admin@example.invalid}
  LOAMZ_AGENTS_SEALING__KEYS__K1: ${CHAT_SEALING_KEY:-}
  LOAMZ_AGENTS_SEALING__PRIMARY: k1
  LOAMZ_AGENTS_HTTP__FRONTEND_URL: ${APP_URL:-http://localhost:5173}
  LOAMZ_AGENTS_SANDBOX__RUNTIME: ${SANDBOX_RUNTIME:-nsjail}
  LOAMZ_AGENTS_LLM__MODEL: ${CHAT_MODEL:-openai/gpt-5.4-mini}
  LOAMZ_AGENTS_LLM__OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LOAMZ_AGENTS_LLM__ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LOAMZ_AGENTS_LLM__GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LOAMZ_AGENTS_LLM__OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  # Email for the agent server's own notifications (optional)
  LOAMZ_AGENTS_NOTIFICATIONS__RESEND_API_KEY: ${RESEND_API_KEY:-}
  # Files live in Loamz Data: this server holds no object-store credentials and signs short-lived tokens per request.
  LOAMZ_AGENTS_DATA__URL: ${AGENTS_DATA_URL:-}
  # Tool servers (MCP over SSE) agents may use; see docs/guides/tool-servers.md. A JSON list, empty by default.
  LOAMZ_AGENTS_TOOLS__SERVERS: ${TOOL_SERVERS:-[]}
  OTEL_SDK_DISABLED: "true"

# Capabilities the nsjail code-interpreter runtime needs. Remove them (and set SANDBOX_RUNTIME) if you provide
# sandboxing another way; without them the server refuses to start with nsjail selected.
x-nsjail: &nsjail
  user: "0:0"
  cgroup: host
  cap_add: [SYS_ADMIN]
  security_opt: ["seccomp=unconfined"]

x-microservice: &microservice
  <<: *agent-image
  profiles: [microservices]
  environment: &microservice-env
    <<: *agent-env
    LOAMZ_MODE: microservices
    # How the services find each other: {name} is the service in dashes, {port} its port (deploy/PORTS.md).
    SERVICE_URL_TEMPLATE: http://agent-{name}:{port}
    AGENT_RUNTIME_SERVICE_URL: http://agent-runtime:8014
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  # ── State ───────────────────────────────────────────────────────────────────
  cell-init:
    <<: *agent-image
    user: "0:0"
    entrypoint: ["python", "/init/cell-init.py"]
    healthcheck: { disable: true }
    command: []
    environment:
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
      STAGING_BUCKET: ${STAGING_BUCKET:-loamz-staging}
      VOLUMES_BUCKET: ${VOLUMES_BUCKET:-loamz-volumes}
    volumes:
      - ./init:/init:ro
      - postgres-tls:/out/postgres-tls
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loamz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./gen-env.sh}
      POSTGRES_DB: agentdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/tls:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      cell-init: { condition: service_completed_successfully }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run ./gen-env.sh}", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  keycloak:
    # The public name (keycloak.localhost) reaches this container from inside the cell too: one address for browsers and services.
    networks: { default: { aliases: ['keycloak.localhost'] } }
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm", "--http-enabled=true", "--http-port=${PORT_KEYCLOAK:-8081}", "--hostname=${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:${PORT_KEYCLOAK:-8081}}", "--hostname-strict=true", "--health-enabled=true", "--proxy-headers=xforwarded"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run ./gen-env.sh}
      # Set KEYCLOAK_THEME_CACHE=false while editing the sign-in theme, so a change shows on reload.
      KC_SPI_THEME__CACHE_THEMES: ${KEYCLOAK_THEME_CACHE:-true}
      KC_SPI_THEME__CACHE_TEMPLATES: ${KEYCLOAK_THEME_CACHE:-true}
      KC_SPI_THEME__STATIC_MAX_AGE: ${KEYCLOAK_THEME_STATIC_MAX_AGE:-2592000}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=require
      KC_DB_USERNAME: ${POSTGRES_USER:-loamz}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Substituted into the realm file at import. All are required: an unset one becomes the literal text.
      DATA_WORKSPACE_CLIENT_SECRET: ${DATA_WORKSPACE_CLIENT_SECRET:?}
      CELL_ADMIN_CLIENT_SECRET: ${CELL_ADMIN_CLIENT_SECRET:?}
      AGENT_MEMBERSHIP_CLIENT_SECRET: ${AGENT_MEMBERSHIP_CLIENT_SECRET:?}
      DIRECTORY_CLIENT_SECRET: ${DIRECTORY_CLIENT_SECRET:?run ./gen-env.sh}
      DATA_WORKSPACE_URL: ${DATA_WORKSPACE_URL:-http://localhost:3011}
    volumes:
      - ../keycloak/realm-loamz.json:/opt/keycloak/data/import/realm-loamz.json:ro
      - ../keycloak/themes/loamz:/opt/keycloak/themes/loamz:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_KEYCLOAK:-8081}:${PORT_KEYCLOAK:-8081}"
    healthcheck:
      # The image has no curl; the management port (9000) answers /health/ready.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── loamz-data ──────────────────────────────────────────────────────────────
  agent-server:
    <<: [*agent-image, *nsjail]
    profiles: [agents, monolith]
    # Lets agents reach a tool server running on this machine (docs/guides/tool-servers.md).
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *agent-env
      LOAMZ_MODE: monolith
    volumes:
      - agent-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_AGENT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # ── Agent server: microservices (the gateway is the only published one) ─────
  agent-gateway:
    <<: *microservice
    environment:
      <<: *microservice-env
      LOAMZ_SERVICE: gateway
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_AGENT:-8000}:8001"
  agent-policy:
    <<: *microservice
    environment: { <<: *microservice-env, LOAMZ_SERVICE: policy }
  agent-conversation:
    <<: *microservice
    environment: { <<: *microservice-env, LOAMZ_SERVICE: conversation }
  agent-job-controller:
    <<: *microservice
    environment: { <<: *microservice-env, LOAMZ_SERVICE: job_controller }
  agent-runtime:
    <<: *microservice
    environment: { <<: *microservice-env, LOAMZ_SERVICE: agent_runtime }
  agent-tool-executor:
    <<: *microservice
    environment: { <<: *microservice-env, LOAMZ_SERVICE: tool_executor }
  agent-human-gate:
    <<: *microservice
    environment: { <<: *microservice-env, LOAMZ_SERVICE: human_gate }
  agent-live-stream:
    <<: *microservice
    environment: { <<: *microservice-env, LOAMZ_SERVICE: live_stream }
  agent-admin:
    <<: *microservice
    environment: { <<: *microservice-env, LOAMZ_SERVICE: admin }

  data-connection:
    extra_hosts: ["host.docker.internal:host-gateway"]
    image: curlimages/curl:8.14.1
    profiles: [with-data]
    environment:
      AGENTS_DATA_URL: ${AGENTS_DATA_URL:-}
    entrypoint: ["sh", "-c", 'test -n "$${AGENTS_DATA_URL}" && curl --fail --silent --show-error --max-time 10 "$${AGENTS_DATA_URL}/readyz"']
    restart: "no"

volumes:
  postgres-data:
  postgres-tls:
  redis-data:
  agent-data:
