{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cell.fullname" . }}
  labels:
    {{- include "cell.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cell.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [data-api, {{ ternary "agent-server" "agent-gateway" (eq .Values.mode "monolith") }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.alerts.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cell.fullname" . }}
  labels:
    {{- include "cell.labels" . | nindent 4 }}
    {{- with .Values.metrics.alerts.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  groups:
    - name: loamz.rules
      rules:
        - alert: LoamzHighErrorRate
          expr: |
            sum by (service) (rate(loamz_http_requests_total{status="5xx"}[5m]))
              / sum by (service) (rate(loamz_http_requests_total[5m])) > 0.05
          for: 10m
          labels: { severity: page }
          annotations:
            summary: "{{ "{{ $labels.service }}" }} returns errors on more than 5% of requests"
        - alert: LoamzSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (service, le) (rate(loamz_http_request_duration_seconds_bucket[5m]))) > 5
          for: 15m
          labels: { severity: ticket }
          annotations:
            summary: "{{ "{{ $labels.service }}" }} p95 latency is above 5 seconds"
        - alert: LoamzDown
          expr: absent(loamz_process_start_time_seconds)
          for: 5m
          labels: { severity: page }
          annotations:
            summary: "No Loamz API server is reporting metrics"
{{- end }}
