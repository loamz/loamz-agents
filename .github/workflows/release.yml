name: Release

# release-please keeps one release PR for the repository. Merging it tags every released component
# (`<component>-v<version>`) and creates GitHub releases; this workflow then publishes the released Python
# distributions to PyPI (trusted publishing, no tokens) in dependency order:
#   tier 1  loamz-engine
#   tier 2  loamz-server (needs engine and the loamz-python clients)
# loamz-reader and the container images are published by release-images.yml.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.paths_released }}
      tags: ${{ steps.rp.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  engine:
    needs: release-please
    if: needs.release-please.outputs.tags == 'true'
    uses: ./.github/workflows/_publish.yml
    with: { name: loamz-engine, dir: server/engine, released: "${{ needs.release-please.outputs.released }}" }
    permissions: { contents: read, id-token: write }

  server:
    needs: [release-please, engine]
    if: always() && needs.release-please.outputs.tags == 'true' && needs.engine.result != 'failure'
    uses: ./.github/workflows/_publish.yml
    with: { name: loamz-server, dir: server/server, released: "${{ needs.release-please.outputs.released }}" }
    permissions: { contents: read, id-token: write }
