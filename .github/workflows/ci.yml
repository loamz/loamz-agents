name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Path filter: what changed, including what depends on it ───────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.plan.outputs.python }}
      deploy: ${{ steps.plan.outputs.deploy }}
      server: ${{ steps.plan.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          list-files: none
          filters: |
            # Anything in `shared` affects every Python package.
            python:
              - 'server/runtime/**'
              - 'server/agents/**'
              - 'meta/**'
              - 'specs/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.importlinter'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'specs/**'
            deploy:
              - 'deploy/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-images.yml'
      # Pushes to main and merge-queue runs always test everything.
      - name: Build job plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PYTHON: ${{ steps.filter.outputs.python }}
          SERVER: ${{ steps.filter.outputs.server }}
          DEPLOY: ${{ steps.filter.outputs.deploy }}
        run: |
          flag() { if [ "$EVENT" != "pull_request" ]; then echo true; else echo "${1:-false}"; fi; }
          echo "python=$(flag "$PYTHON")" >> "$GITHUB_OUTPUT"
          echo "server=$(flag "$SERVER")" >> "$GITHUB_OUTPUT"
          echo "deploy=$(flag "$DEPLOY")" >> "$GITHUB_OUTPUT"

  # ── Style and architecture: ruff, and the import contracts in .importlinter ─
  lint:
    name: Lint and import contracts
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages --all-groups --extra openai --extra anthropic --extra gemini --extra web --extra mcp --extra code --extra tools --extra testing --extra models --extra console
      # ruff comes from uv.lock, so the version used here is the locked one.
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - name: Import contracts
        run: uv run --frozen lint-imports --config .importlinter

  # ── Python distributions in the uv workspace (one lock, Python 3.14) ──────
  python:
    name: Python / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: loamz-runtime, dir: server/runtime }
          - { name: loamz-agents-server, dir: server/agents }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      LOAMZ_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      LOAMZ_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages --all-groups --extra openai --extra anthropic --extra gemini --extra web --extra mcp --extra code --extra tools --extra testing --extra models --extra console
      - name: Tests
        working-directory: ${{ matrix.dir }}
        run: uv run --frozen --no-sync --package ${{ matrix.name }} pytest -q -n 4 --timeout=120 --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ matrix.dir }}/test-results.xml
          if-no-files-found: ignore

  # ── Tests that need Docker (SeaweedFS, Iceberg catalog, pgvector, models) ──
  integration:
    name: Server integration
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' &&
      (github.event_name == 'merge_group' ||
       contains(github.event.pull_request.labels.*.name, 'run-integration'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages --all-groups --extra openai --extra anthropic --extra gemini --extra web --extra mcp --extra code --extra tools --extra testing --extra models --extra console
      - name: Integration tests
        run: make test-slow

  # Validate the standalone Agents deployment artifacts.
  deploy:
    name: Agents deployment configuration
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: "deploy/docker/*.Dockerfile"
          failure-threshold: error
      - name: Check compose
        working-directory: deploy/compose
        run: |
          ./gen-env.sh
          docker compose --profile agents config -q
          docker compose --profile agents --profile with-data config -q

  # ── The only required status check ─────────────────────────────────────────
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, python, integration, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled (skipped is fine)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null
